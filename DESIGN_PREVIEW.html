  p.settings={...p.settings,cost:String(cost),logistics:String(logistics)};
  try{localStorage.setItem(productKey,JSON.stringify(all));drafts.delete(selected);window.dispatchEvent(new Event('hogar:products-changed'));draw();catalog.querySelector('#hc-save-status').textContent='Сохранено. Расходы применены к расчёту за выбранный период.';}catch(_){status.textContent='Не удалось сохранить. Проверьте свободную память браузера.'}
 });
 window.addEventListener('hogar:orders-loaded',e=>{saveOrders(e.detail);message='';draw()});
 window.addEventListener('hogar:products-changed',draw);
 window.addEventListener('hogar:finance-updated',()=>{drawHome();if(selected)drawCatalog()});
 window.addEventListener('storage',e=>{if(e.key===productKey||e.key?.startsWith('hogar_fbs_finance_'))draw()});
 document.querySelector('.bottom-nav')?.addEventListener('click',e=>{if(e.target.closest('[data-tab="home"],[data-tab="catalog"]')){draw();if(!hasOrders&&token())refresh()}});
 draw();
})();
