  let matching=products.filter(p=>(name(p)+' '+(p.name||'')+' '+(p.sku||'')).toLowerCase().includes(search.toLowerCase())&&(filter!=='missing'||A.settings(p).cost===null));const pages=Math.max(1,Math.ceil(matching.length/24));page=Math.min(page,pages);
  catalog.innerHTML='<div class="hc-root">'+heading('HOGAR · ТОВАРЫ','Каталог','Расходы под контролем. Каждый товар на своём месте.','<button type="button" class="hc-sync" data-sync '+(busy?'disabled':'')+'>↻ Синхронизировать</button>')+'<div class="hc-catalog-summary"><div><strong>'+products.length+'</strong><span>товаров в каталоге</span></div><div><strong>'+products.filter(p=>A.settings(p).cost!==null).length+'</strong><span>с себестоимостью</span></div><div><strong>500 ₽</strong><span>логистика по умолчанию / шт.</span></div></div><div class="hc-search"><label for="hc-search">Поиск по названию или артикулу</label><input id="hc-search" type="search" value="'+esc(search)+'" placeholder="Найти ваш товар…" autocomplete="off"></div><div class="hc-catalog-tools"><div class="hc-filters" role="group" aria-label="Фильтр товаров"><button type="button" data-filter-catalog="all" aria-pressed="'+(filter==='all')+'">Все товары</button><button type="button" data-filter-catalog="missing" aria-pressed="'+(filter==='missing')+'">Без себестоимости</button></div><span id="hc-found">Найдено: '+matching.length+'</span></div><p id="hc-catalog-status" class="hc-status" role="status">'+esc(message||'Существующие товары и расходы сохраняются при синхронизации.')+'</p><div class="hc-product-grid">'+matching.slice((page-1)*24,page*24).map(p=>{const s=A.settings(p);return '<button type="button" class="hc-product" data-product="'+esc(p.id)+'"><span class="hc-product-image">'+picture(p)+'</span><span class="hc-product-body"><small>'+esc(p.sku||'Без артикула')+'</small><strong>'+esc(name(p))+'</strong><span class="hc-product-cost">'+(s.cost===null?'<i>Укажите себестоимость</i>':'Себестоимость <b>'+money(s.cost)+'</b>')+'</span><span class="hc-product-logistics">До СЦ · '+money(s.logistics)+' / шт.</span><span class="hc-product-link">Аналитика и расходы '+svg('arrow')+'</span></span></button>'}).join('')+'</div>'+(matching.length?'':'<div class="hc-card hc-empty">'+svg('box')+'<h3>'+(products.length?'Товары не найдены':'Добавим ваши товары')+'</h3><p>'+(products.length?'Попробуйте другое название или артикул.':'Нажмите «Синхронизировать», чтобы загрузить весь каталог Ozon. Сохранённые расходы останутся на месте.')+'</p></div>')+(pages>1?'<div class="hc-pagination"><button data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>← Назад</button><span>'+page+' / '+pages+'</span><button data-page="'+(page+1)+'" '+(page===pages?'disabled':'')+'>Далее →</button></div>':'')+'<p class="hc-footnote">Себестоимость и логистика редактируются в карточке. Цены Ozon не изменяются. Старые инструменты расчёта цены доступны во вкладке «Цены».</p></div>';
 }
 function draw(){drawHome();drawCatalog()}
 function saveOrders(d){if(!Array.isArray(d.orders))return;orders=d.orders;hasOrders=true;partial=!!d.partial;checked=d.checked_at||new Date().toISOString();failed=false;
  try{localStorage.setItem(orderKey,JSON.stringify({orders,partial,checked_at:checked}))}catch(_){message='Данные загружены, но не удалось сохранить их в памяти браузера.'}
 }
 async function refresh(){if(busy)return;window.HogarHome?.refresh({token:token(),range:A.period(period)},true);if(!token()){message='Для загрузки введите пароль доступа в разделе «Цены».';failed=true;draw();return}
  busy=true;message='Обновляем заказы Ozon…';failed=false;draw();try{const r=await fetch(base+'/api/orders?days=35',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(r.status===401?'Проверьте пароль доступа в разделе «Цены».':'Ozon временно недоступен (HTTP '+r.status+').');if(!Array.isArray(d.orders))throw Error('Неожиданный ответ сервера.');message='';saveOrders(d);
  }catch(e){failed=true;message=e.message}finally{busy=false;draw()}
 }
 async function sync(){if(busy)return;if(!token()){message='Для синхронизации введите пароль доступа в разделе «Цены».';drawCatalog();return}
  busy=true;message='Загружаем все товары из Ozon…';drawCatalog();try{const r=await fetch(base+'/api/products',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw Error('Не удалось загрузить каталог (HTTP '+r.status+').');if(!Array.isArray(d.items))throw Error('Неожиданный ответ сервера.');const next=A.mergeProducts(items(),d.items);localStorage.setItem(productKey,JSON.stringify(next));window.dispatchEvent(new Event('hogar:products-changed'));message='Получено '+d.items.length+' товаров Ozon. Ваши расходы и названия сохранены.';
  }catch(e){message=e.name==='QuotaExceededError'?'Недостаточно памяти для каталога. Старые данные сохранены.':e.message}finally{busy=false;draw()}
 }
 for(const host of [home,catalog])host.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  if(b.hasAttribute('data-period')){period=b.dataset.period;draw();return}
  if(b.hasAttribute('data-refresh')){refresh();return}
  if(b.hasAttribute('data-sync')){sync();return}
  if(b.hasAttribute('data-product')){selected=b.dataset.product;drawCatalog();window.scrollTo(0,0);if(!hasOrders)refresh();return}
  if(b.hasAttribute('data-back')){selected=null;drawCatalog();window.scrollTo(0,0);return}
  if(b.dataset.filterCatalog){filter=b.dataset.filterCatalog;page=1;drawCatalog();return}
  if(b.dataset.page){page=Number(b.dataset.page);drawCatalog();window.scrollTo(0,0)}
 });
 catalog.addEventListener('input',e=>{if(e.target.id==='hc-cost'||e.target.id==='hc-logistics'){const form=catalog.querySelector('#hc-cost-form');drafts.set(selected,{cost:form.elements.cost.value,logistics:form.elements.logistics.value});return}if(e.target.id==='hc-search'){search=e.target.value;page=1;const start=e.target.selectionStart;drawCatalog();const input=catalog.querySelector('#hc-search');input.focus();input.setSelectionRange(start,start)}});
 catalog.addEventListener('submit',e=>{if(e.target.id!=='hc-cost-form')return;e.preventDefault();const form=e.target,cost=A.number(form.elements.cost.value),logistics=A.number(form.elements.logistics.value),status=form.querySelector('#hc-save-status');if(cost===null||cost<0||logistics===null||logistics<0||cost>1e9||logistics>1e9){status.textContent='Укажите расходы от 0 до 1 000 000 000 ₽.';return}
  const all=items(),p=all.find(p=>String(p.id)===selected);if(!p){status.textContent='Товар больше не найден в каталоге.';return}
  p.settings={...p.settings,cost:String(cost),logistics:String(logistics)};
  try{localStorage.setItem(productKey,JSON.stringify(all));drafts.delete(selected);window.dispatchEvent(new Event('hogar:products-changed'));draw();catalog.querySelector('#hc-save-status').textContent='Сохранено. Расходы применены к расчёту за выбранный период.';}catch(_){status.textContent='Не удалось сохранить. Проверьте свободную память браузера.'}
 });
 window.addEventListener('hogar:orders-loaded',e=>{saveOrders(e.detail);message='';draw()});
 window.addEventListener('hogar:products-changed',draw);
 window.addEventListener('hogar:finance-updated',()=>{drawHome();if(selected)drawCatalog()});
 window.addEventListener('storage',e=>{if(e.key===productKey||e.key?.startsWith('hogar_fbs_finance_'))draw()});
 document.querySelector('.bottom-nav')?.addEventListener('click',e=>{if(e.target.closest('[data-tab="home"],[data-tab="catalog"]')){draw();if(!hasOrders&&token())refresh()}});
 draw();
})();
</script></body></html>
